# A descriptive name for this experiment run
run_name: "shakespeare_diffusion_base"

# General settings
seed: 42
device: "cuda:0"
log_run: True
save_model: True

# Data loading settings
data:
  dir: './shakespeare_char/'
  batch_size: 96
  context_length: 512

# Model architecture
model:
  n_layer: 3
  n_head: 2
  n_embd: 384
  cond_dim: 128
  dropout: 0.0
  bias: True
  timestep_embedding: True
  use_gated_delta: false
  gated_delta_layers: [0]
  
  # GatedDeltaNet hyperparameters (memory-optimized)
  attn_mode: 'chunk'            # 'chunk' or 'fused_recurrent'
  gated_delta_expand_v: 1.0     # Match SelfAttention size (critical!)
  gated_delta_use_gate: true    # Keep gate for expressivity
  gated_delta_use_short_conv: false  # Must disable to avoid OOM
  gated_delta_allow_neg_eigval: true
  gated_delta_conv_size: 2      # Ignored when use_short_conv=false
  gated_delta_norm_eps: 1e-5

# Diffusion noise settings
noise:
  # Type can be 'log_linear' or 'geometric' or 'masking'
  type: "masking"
  sigma_min: 1.0e-4
  sigma_max: 20.0
  schedule: "cosine"

# Trainer settings
trainer:
  n_epochs: 2
  lr: 4.0e-3
  # Use Muon optimizer for weight matrices
  use_muon: True
  # Use data distribution for sampling
  prob_sampling: False

# Inference settings (used only if a model path is found)
inference:
  model_path: "model_epoch_1.pth"
  run_inference: False
  steps: 256
  eps: 1.0e-5

# Hydra's setting for creating a unique output directory for each run
hydra:
  run:
    dir: outputs/${run_name}/${now:%Y-%m-%d_%H-%M-%S}

