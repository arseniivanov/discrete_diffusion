defaults:
  - muon_masking  # Inherit all the defaults from your main config
  - _self_
  - override hydra/sweeper: basic # Specify we are using the basic sweeper

hydra:
  sweeper:
    params:
      model.dropout: 0.0, 0.1
      model.timestep_embedding: true, false
      trainer.lr: 0.01, 0.005, 0.001
      noise.type: log_linear, geometric, masking
