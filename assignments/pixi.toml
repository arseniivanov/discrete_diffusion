[project]
name = "wasp-nlp"
version = "0.1.0"
description = "NLP course repo"
channels = ["pytorch","conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
numpy = ">=1.24.0"
scipy = ">=1.10.0"
matplotlib = ">=3.7.0"
pandas = ">=2.0.0"
tqdm = ">=4.65.0"
scikit-learn = ">=1.3.0"
pip = "*"
seaborn = "*"
safetensors = "*"
requests = "*"
transformers = "*"
spacy = "*"
nltk = "*"
datasets = "*"
accelerate = "==0.20.3"

[tasks]
install = "pip install --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cu128"
