[project]
name = "diffusion"
version = "0.1.0"
description = "Diffusion"
channels = ["pytorch","conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
numpy = ">=1.24.0"
scipy = ">=1.10.0"
matplotlib = ">=3.7.0"
pandas = ">=2.0.0"
tqdm = ">=4.65.0"
scikit-learn = ">=1.3.0"
imath = "*"
pip = "*"
seaborn = "*"
safetensors = "*"
requests = "*"
hydra-core = "*"

[pypi-dependencies]
flash-linear-attention = "*"
nvidia-cutlass-dsl = "==4.5.1"

[tasks]
install = "pip install --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cu128"
pillow_formats = "pip install pillow=='11.3.0' pillow-jxl-plugin=='1.3.4'"
